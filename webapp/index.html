<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Streamer Clicker</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#14101f">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="stat"><span class="stat-icon">💜</span><span id="followersDisplay">0</span></div>
    <div class="stat"><span class="stat-icon">💎</span><span id="gemsDisplay">0</span></div>
  </header>

  <main id="viewRoom" class="view active">
    <div id="roomScene">
      <svg id="roomSvg" viewBox="0 0 360 400" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">

        <!-- background wall -->
        <rect id="wall" x="0" y="0" width="360" height="400" fill="var(--wall)"/>
        <rect id="ambientGlow" x="0" y="0" width="360" height="400" opacity="0"/>

        <!-- window -->
        <g id="windowGroup">
          <rect x="50" y="30" width="70" height="90" rx="6" fill="#0c0818" stroke="#3a2f55" stroke-width="4"/>
          <circle cx="85" cy="60" r="10" fill="#ffe9a8" opacity="0.9"/>
          <circle cx="106" cy="95" r="2" fill="#fff" opacity="0.8"/>
          <circle cx="66" cy="100" r="1.6" fill="#fff" opacity="0.6"/>
          <circle cx="96" cy="45" r="1.4" fill="#fff" opacity="0.7"/>
        </g>

        <!-- rgb strip along ceiling, tiers via class on #rgbStrip -->
        <g id="rgbStrip" class="tier-0">
          <rect x="0" y="0" width="360" height="6" fill="url(#rgbGradient)"/>
          <rect id="rgbFloorStrip" x="0" y="352" width="360" height="4" fill="url(#rgbGradient)"/>
        </g>

        <!-- wall decor unlocked with editing team -->
        <g id="wallDecor" class="tier-0">
          <rect x="230" y="26" width="66" height="46" rx="4" fill="#20182f" stroke="var(--accent-purple)" stroke-width="2"/>
          <path d="M238 62 L256 40 L270 54 L282 38 L290 62 Z" fill="#8c5cff" opacity="0.6"/>
        </g>

        <!-- monitors, behind character, tiers 1-3 -->
        <g id="monitorGroup" class="tier-0">
          <g id="monitorSingle">
            <rect x="132" y="70" width="96" height="64" rx="4" fill="#100c1c" stroke="#463a66" stroke-width="3"/>
            <rect x="140" y="78" width="80" height="48" rx="2" fill="#1c1330"/>
            <path id="waveformPath" d="M144 102 L154 92 L164 112 L174 96 L184 108 L194 90 L204 104 L214 98" fill="none" stroke="var(--accent-pink)" stroke-width="2" stroke-linecap="round"/>
            <rect x="172" y="134" width="16" height="10" fill="#2a2140"/>
          </g>
          <g id="monitorDouble">
            <rect x="94" y="66" width="78" height="52" rx="4" fill="#100c1c" stroke="#463a66" stroke-width="3"/>
            <rect x="100" y="72" width="66" height="38" rx="2" fill="#1c1330"/>
            <rect x="188" y="66" width="78" height="52" rx="4" fill="#100c1c" stroke="#463a66" stroke-width="3"/>
            <rect x="194" y="72" width="66" height="38" rx="2" fill="#1c1330"/>
            <g id="chatLines" fill="var(--accent-gold)">
              <rect x="106" y="80" width="30" height="4" rx="2"/>
              <rect x="106" y="88" width="46" height="4" rx="2" fill="var(--accent-pink)"/>
              <rect x="106" y="96" width="22" height="4" rx="2"/>
            </g>
          </g>
          <g id="liveBadge">
            <rect x="150" y="52" width="60" height="18" rx="9" fill="var(--accent-pink)"/>
            <text x="180" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">● EN VIVO</text>
          </g>
        </g>

        <!-- ring light glow behind character head, webcam tiers -->
        <circle id="ringLight" cx="183" cy="50" r="36" fill="none" stroke="var(--accent-gold)" stroke-width="5" opacity="0"/>

        <!-- guest character (collab upgrade) -->
        <g id="guestCharacter" class="tier-0">
          <ellipse cx="248" cy="330" rx="34" ry="10" fill="#000" opacity="0.25"/>
          <path d="M220 330 Q220 288 248 288 Q276 288 276 330 Z" fill="#5b4a86"/>
          <circle cx="248" cy="270" r="26" fill="#e8b892"/>
          <path d="M222 262 Q226 232 248 234 Q270 232 274 262 Q270 246 248 246 Q226 246 222 262 Z" fill="#4a3a70"/>
          <circle cx="240" cy="272" r="2.4" fill="#2a2140"/>
          <circle cx="256" cy="272" r="2.4" fill="#2a2140"/>
          <path d="M240 280 Q248 284 256 280" fill="none" stroke="#2a2140" stroke-width="1.6" stroke-linecap="round"/>
        </g>

        <!-- editing helper bot + floating clip icons -->
        <g id="editHelper" class="tier-0">
          <g id="editBot">
            <rect x="66" y="296" width="30" height="26" rx="6" fill="#120a1f" stroke="var(--accent-purple)" stroke-width="2"/>
            <circle id="editBotLight" cx="81" cy="309" r="4" fill="var(--accent-gold)"/>
          </g>
          <g id="clipIcons" fill="var(--accent-purple)">
            <g class="clipIcon" transform="translate(70,54)"><rect width="14" height="10" rx="2"/></g>
            <g class="clipIcon" transform="translate(270,124)"><rect width="14" height="10" rx="2"/></g>
            <g class="clipIcon" transform="translate(250,196)"><rect width="14" height="10" rx="2"/></g>
          </g>
        </g>

        <!-- desk -->
        <g id="desk">
          <rect x="0" y="298" width="360" height="6" fill="var(--accent-purple)" opacity="0.4"/>
          <rect x="0" y="304" width="360" height="16" fill="#3a2c56"/>
          <rect x="0" y="320" width="360" height="80" fill="#170f26"/>
        </g>

        <!-- player character: Chiyo, layered PNGs, bust behind desk -->
        <g id="character">
          <image data-role="hairBack" class="charLayer" x="123" y="0" width="114" height="480" href="assets/character/hair_back_white.png"/>
          <image data-role="torso" class="charLayer" x="123" y="0" width="114" height="480" href="assets/character/torso.png"/>
          <image data-role="head" class="charLayer" x="123" y="0" width="114" height="480" href="assets/character/head.png"/>
          <image data-role="blush" class="charLayer" x="123" y="0" width="114" height="480" href="assets/character/blush.png"/>
          <image data-role="eyes" class="charLayer charEyes" x="123" y="0" width="114" height="480" href="assets/character/eyes.png"/>
          <image data-role="brows" class="charLayer" x="123" y="0" width="114" height="480" href="assets/character/brows_neutral.png"/>
          <image data-role="mouth" class="charLayer" x="123" y="0" width="114" height="480" href="assets/character/mouth_neutral.png"/>
          <image data-role="hairFront" class="charLayer" x="123" y="0" width="114" height="480" href="assets/character/hair_front_white.png"/>
        </g>

        <!-- desk props -->
        <g id="mic" class="tier-0">
          <rect x="150" y="336" width="6" height="30" fill="#463a66"/>
          <rect x="130" y="330" width="46" height="14" rx="7" fill="#2a2140" stroke="var(--accent-pink)" stroke-width="2"/>
          <circle id="micGlow" cx="153" cy="337" r="16" fill="var(--accent-pink)" opacity="0"/>
        </g>

        <g id="webcam" class="tier-0">
          <rect x="196" y="318" width="4" height="14" fill="#463a66"/>
          <rect x="184" y="308" width="30" height="16" rx="4" fill="#100c1c" stroke="#463a66" stroke-width="2"/>
          <circle id="webcamDot" cx="196" cy="316" r="3" fill="#ff3b5c"/>
        </g>

        <g id="onAirTag" class="tier-0">
          <rect x="122" y="316" width="70" height="16" rx="8" fill="var(--accent-pink)"/>
          <text x="157" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">ON AIR</text>
        </g>

      </svg>

      <svg style="position:absolute;width:0;height:0">
        <defs>
          <linearGradient id="rgbGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="var(--accent-pink)"/>
            <stop offset="50%" stop-color="var(--accent-purple)"/>
            <stop offset="100%" stop-color="var(--accent-gold)"/>
          </linearGradient>
        </defs>
      </svg>

      <button id="clickZone" aria-label="Transmitir"></button>
      <div id="floatLayer"></div>
    </div>
    <div id="rateInfo">
      <span id="perClickDisplay"></span>
      <span id="perSecDisplay"></span>
    </div>
  </main>

  <section id="viewCharacter" class="view">
    <div id="charPreviewWrap">
      <svg id="charPreviewSvg" viewBox="-70 -110 140 220" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="customizePanel">
      <div class="customizeGroup">
        <div class="customizeLabel">Color de pelo</div>
        <div id="hairColorRow" class="swatchRow"></div>
      </div>
    </div>
  </section>

  <section id="viewShop" class="view">
    <div id="shopList"></div>
  </section>

  <section id="viewGacha" class="view">
    <button id="pullButton">Invocar (<span id="pullCostDisplay"></span> 💎)</button>
    <div id="gachaGallery"></div>
  </section>

  <div id="offlineModal" class="modal hidden">
    <div class="modal-card">
      <h2>¡Volviste!</h2>
      <p id="offlineText"></p>
      <button id="offlineCloseButton">Genial</button>
    </div>
  </div>

  <div id="pullModal" class="modal hidden">
    <div class="modal-card">
      <img id="pullImage" src="" alt="carta">
      <p id="pullRarity"></p>
      <button id="pullCloseButton">Cerrar</button>
    </div>
  </div>

  <nav id="tabbar">
    <button class="tabButton active" data-view="viewRoom">Cuarto</button>
    <button class="tabButton" data-view="viewCharacter">Personaje</button>
    <button class="tabButton" data-view="viewShop">Tienda</button>
    <button class="tabButton" data-view="viewGacha">Gacha</button>
  </nav>
</div>
<script src="game.js"></script>
</body>
</html>
